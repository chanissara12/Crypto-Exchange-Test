<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Crypto Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/styles/style.css" rel="stylesheet">
  </head>
  <body class="bg-light-gray">
    <!-- Navbar will be loaded here -->
    <div id="navbar-container"></div>

    <div class="container mt-5">
      <div id="content" class="loading">
        <p>Loading profile...</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Load navbar from navbar.html
      fetch('/navbar.html')
        .then(response => response.text())
        .then(html => {
          const container = document.getElementById('navbar-container');
          const fragment = document.createRange().createContextualFragment(html);
          container.appendChild(fragment);
        })
        .catch(error => console.error('Error loading navbar:', error));

      // Check if user is logged in
      function checkLogin() {
        const loginData = localStorage.getItem('loginData');
        
        if (!loginData) {
          // Not logged in, redirect to login
          window.location.href = '/login';
          return null;
        }
        
        try {
          return JSON.parse(loginData);
        } catch (e) {
          console.error('Invalid login data:', e);
          localStorage.removeItem('loginData');
          window.location.href = '/login';
          return null;
        }
      }

      // Load user profile
      async function loadProfile() {
        const user = checkLogin();
        if (!user) return;

        try {
          const response = await fetch(`/profile/data/${user.userId}`);
          const data = await response.json();

          if (data.success) {
            displayProfile(data);
          } else {
            showError(data.message || 'Failed to load profile');
          }
        } catch (error) {
          console.error('Error loading profile:', error);
          showError('An error occurred while loading your profile');
        }
      }

      // Display profile data
      function displayProfile(data) {
        const { user, wallets, offers, stats } = data;

        let html = `
          <div class="profile-header">
            <div class="row align-items-center">
              <div class="col-md-8">
                <h2>👤 ${user.user_name}</h2>
                <div class="user-info">
                  <div class="info-item">
                    <label>Email</label>
                    <div class="value">${user.email}</div>
                  </div>
                  <div class="info-item">
                    <label>Member Since</label>
                    <div class="value">${new Date(user.createdAt).toLocaleDateString()}</div>
                  </div>
                </div>
              </div>
              <div class="col-md-4 text-center">
                <div class="stat-box">
                  <span class="number">${stats.totalWallets}</span>
                  <div class="label">Wallets</div>
                </div>
                <div class="stat-box">
                  <span class="number">${stats.totalOffers}</span>
                  <div class="label">Offers</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Stats Section -->
          <div class="row mb-4">
            <div class="col-md-3">
              <div class="stat-box">
                <span class="number" style="color: #28a745;">${stats.buyOffers}</span>
                <div class="label">Buy Offers</div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="stat-box">
                <span class="number" style="color: #dc3545;">${stats.sellOffers}</span>
                <div class="label">Sell Offers</div>
              </div>
            </div>
            <div class="col-md-6"></div>
          </div>

          <!-- Wallets Section -->
          <div class="card">
            <div class="card-header">
              💰 My Wallets (${wallets.length})
              <a href="/deposit" class="btn bg-light float-end">Deposit</a>
            </div>
            <div class="card-body">
              ${wallets.length > 0 ? `
                ${wallets.map(wallet => `
                  <div class="wallet-item">
                    <span class="currency">${wallet.currency_id}</span>
                    <span class="balance">${parseFloat(wallet.balance).toFixed(8)}</span>
                    <div style="clear: both;"></div>
                  </div>
                `).join('')}
              ` : `
                <p class="text-muted">No wallets yet</p>
              `}
            </div>
          </div>

          <!-- Offers Section -->
          <div class="card">
            <div class="card-header">
              📊 My Offers (${offers.length})
            </div>
            <div class="card-body">
              ${offers.length > 0 ? `
                ${offers.map(offer => `
                  <div class="offer-item">
                    <div class="header">
                      <span>
                        <span class="badge ${offer.type === 'BUY' ? 'bg-success' : 'bg-danger'}">${offer.type}</span>
                        <strong>${offer.crypto_currency_id} / ${offer.fiat_currency_id}</strong>
                      </span>
                      <span class="badge bg-secondary">${offer.status}</span>
                    </div>
                    <div class="details">
                      <div><strong>Price:</strong> ${parseFloat(offer.price).toFixed(8)}</div>
                      <div><strong>Limit:</strong> ${parseFloat(offer.order_limit).toFixed(3)}</div>
                      <div><strong>Available:</strong> ${parseFloat(offer.available).toFixed(8)}</div>
                      <div><strong>Payment:</strong> ${offer.payment_method}</div>
                    </div>
                  </div>
                `).join('')}
              ` : `
                <p class="text-muted">No offers yet</p>
              `}
            </div>
          </div>

          <div class="logout-btn text-center">
            <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
          </div>
        `;

        document.getElementById('content').innerHTML = html;
      }

      // Show error
      function showError(message) {
        const errorHtml = `
          <div class="error-page">
            <div class="error-card">
              <h2>❌ Error</h2>
              <p>${message}</p>
              <a href="/login" class="btn btn-primary mt-3">Back to Login</a>
            </div>
          </div>
        `;
        document.body.innerHTML = errorHtml;
      }

      // Logout function
      function logout() {
        localStorage.removeItem('loginData');
        window.location.href = '/login';
      }

      // Load profile on page load
      document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
  </body>
</html>
