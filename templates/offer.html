<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Offer - Crypto Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/styles/style.css" rel="stylesheet">
  </head>
  <body class="bg-light-gray">
    <div id="navbar-container"></div>

    <div class="container mt-5 mb-5" id="main-container" style="display: none;">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          
          <div class="mb-3">
            <a href="/markets" class="btn btn-outline-secondary btn-sm">← Back to Market</a>
          </div>

          <div class="card">
            <div class="card-header">
              📝 Create a New Offer
            </div>
            <div class="card-body p-4">
              <div id="alertContainer"></div>
              
              <form id="createOfferForm">
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Offer Type</label>
                    <div>
                      <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="offerType" id="typeBuy" value="BUY" checked>
                        <label class="btn btn-outline-success" for="typeBuy">BUY</label>

                        <input type="radio" class="btn-check" name="offerType" id="typeSell" value="SELL">
                        <label class="btn btn-outline-danger" for="typeSell">SELL</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label for="payment_method" class="form-label">Payment Method</label>
                    <select class="form-select" id="payment_method" required>
                      <option value="BANK_TRANSFER">Bank Transfer</option>
                      <option value="PAYPAL">PayPal</option>
                      <option value="CREDIT_CARD">Credit Card</option>
                    </select>
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="crypto_currency" class="form-label">Crypto Currency</label>
                    <select class="form-select" id="crypto_currency" required>
                      <option value="">Loading...</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="fiat_currency" class="form-label">Fiat Currency</label>
                    <select class="form-select" id="fiat_currency" required>
                      <option value="">Loading...</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="price" class="form-label">Price per unit</label>
                  <input type="number" class="form-control" id="price" placeholder="e.g. 50000.00" step="0.00000001" min="0" required>
                </div>

                <div class="mb-3">
                  <label for="available" class="form-label">Available Amount</label>
                  <input type="number" class="form-control" id="available" placeholder="Amount of crypto you are offering to trade" step="0.00000001" min="0" required>
                </div>

                <div class="mb-4">
                  <label for="order_limit" class="form-label">Order Limit (Fiat)</label>
                  <input type="number" class="form-control" id="order_limit" placeholder="Maximum fiat limit for a single order" step="0.01" min="0" required>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Create Offer</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Load navbar
      fetch('/navbar.html')
        .then(response => response.text())
        .then(html => {
          const container = document.getElementById('navbar-container');
          const fragment = document.createRange().createContextualFragment(html);
          container.appendChild(fragment);
        })
        .catch(error => console.error('Error loading navbar:', error));

      document.addEventListener('DOMContentLoaded', async () => {
        const loginData = localStorage.getItem('loginData');
        
        // Enforce login
        if (!loginData) {
          window.location.href = '/login';
          return;
        }
        
        const { userId } = JSON.parse(loginData);
        document.getElementById('main-container').style.display = 'block';

        // Load Currencies dynamically
        try {
          const response = await fetch('/seed/currencies.json');
          const currencies = await response.json();
          
          const cryptoSelect = document.getElementById('crypto_currency');
          const fiatSelect = document.getElementById('fiat_currency');
          
          cryptoSelect.innerHTML = '';
          fiatSelect.innerHTML = '';

          currencies.forEach(c => {
            if (c.type === 'CRYPTO') {
              cryptoSelect.add(new Option(`${c.id} - ${c.name}`, c.id));
            } else if (c.type === 'FIAT') {
              fiatSelect.add(new Option(`${c.id} - ${c.name}`, c.id));
            }
          });
        } catch (error) {
          console.error('Failed to load currencies:', error);
        }

        // Handle Form Submission
        document.getElementById('createOfferForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const alertContainer = document.getElementById('alertContainer');
          const btn = document.getElementById('submitBtn');
          
          const payload = {
            user_id: userId,
            type: document.querySelector('input[name="offerType"]:checked').value,
            payment_method: document.getElementById('payment_method').value,
            crypto_currency_id: document.getElementById('crypto_currency').value,
            fiat_currency_id: document.getElementById('fiat_currency').value,
            price: parseFloat(document.getElementById('price').value),
            available: parseFloat(document.getElementById('available').value),
            order_limit: parseFloat(document.getElementById('order_limit').value),
            status: "OPEN"
          };

          btn.disabled = true;
          btn.textContent = 'Processing...';

          try {
            // POST to your backend route for creating an offer
            const response = await fetch('/offer', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.success) {
              alertContainer.innerHTML = '<div class="alert alert-success">✅ Offer created successfully! Redirecting to profile...</div>';
              setTimeout(() => {
                window.location.href = '/profile';
              }, 1500);
            } else {
              alertContainer.innerHTML = `<div class="alert alert-danger">❌ ${data.message || 'Failed to create offer'}</div>`;
              btn.disabled = false;
              btn.textContent = 'Create Offer';
            }
          } catch (error) {
            alertContainer.innerHTML = `<div class="alert alert-danger">❌ Network error: ${error.message}</div>`;
            btn.disabled = false;
            btn.textContent = 'Create Offer';
          }
        });
      });
    </script>
  </body>
</html>
