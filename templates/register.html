<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Crypto Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/styles/style.css" rel="stylesheet">
  </head>
  <body class="auth-page">
    <div class="register-container">
      <div class="card register-card">
        <div class="card-body">
          <div class="register-header">
            <h2>📝 Register</h2>
            <p>Create a new crypto exchange account</p>
          </div>

          <div id="alertContainer"></div>

          <form id="registerForm">
            <div class="form-group">
              <label for="user_name" class="form-label">Username</label>
              <input type="text" class="form-control" id="user_name" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn btn-register">Register</button>
          </form>

          <div class="login-link">
            <p>Already have an account? <a href="/login">Login here</a></p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const user_name = document.getElementById('user_name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const alertContainer = document.getElementById('alertContainer');
        const submitBtn = document.querySelector('.btn-register');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';

        try {
          const response = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_name, email, password })
          });

          const data = await response.json();
          
          if (data.success) {
            alertContainer.innerHTML = `<div class="alert alert-success">Registration successful! Redirecting...</div>`;
            setTimeout(() => window.location.href = '/login', 1500);
          } else {
            alertContainer.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
          }
        } catch (error) {
          alertContainer.innerHTML = `<div class="alert alert-danger">An error occurred: ${error.message}</div>`;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register';
        }
      });
    </script>
  </body>
</html>
